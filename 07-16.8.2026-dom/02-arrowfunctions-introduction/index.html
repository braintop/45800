    <script>
        //1 - regular function
        function sayHello(){
            console.log("Hello");
        }

        sayHello();
       
        //2 - arrow function
        let sayHellow =    ()=>{
            console.log("Hello");

        sayHellow();

            console.log("Hello");
        }
        sayHellow();
    </script>
