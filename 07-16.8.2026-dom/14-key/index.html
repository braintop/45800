<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>




    <script>

        document.addEventListener("keydown", (e) => {
            console.log("Key:", e.key);//e.key is the key that was pressed
            console.log("Code:", e.code);//e.code is the code of the key that was pressed

            if (e.key === "Enter") {
                console.log("Enter was pressed!");
            }

            if (e.key === "Escape") {
                console.log("Escape was pressed!");
            }
        });


    </script>
</body>

</html>
