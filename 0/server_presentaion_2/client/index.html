<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tasks</title>
  <style>
    :root { --bg: #f5f5f8; --card: #fff; --border: #d4d2e0; --text: #2d2a40; --muted: #7c7893; --primary: #ff6d5a; --ok: #2ba36b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; font-size: 15px; cursor: pointer; }
    .add { background: var(--primary); color: #fff; font-weight: bold; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    li.done .title { text-decoration: line-through; color: var(--muted); }
    .title { flex: 1; }
    .del { background: transparent; color: var(--muted); padding: 4px 8px; }
    .del:hover { color: var(--primary); }
    .status { font-size: 13px; color: var(--muted); margin-top: 12px; }
    .error { color: var(--primary); }
  </style>
</head>
<body>
  <main>
    <h1>My Tasks</h1>
    <p class="sub">משימות מה-API (Neon). משימות שנוצרו דרך n8n יופיעו כאן אחרי רענון.</p>
    <form id="add">
      <input id="title" type="text" placeholder="משימה חדשה…" autocomplete="off" required>
      <button class="add" type="submit">הוספה</button>
    </form>
    <ul id="list"></ul>
    <p class="status" id="status"></p>
  </main>
  <script>
    const list = document.getElementById("list");
    const status = document.getElementById("status");

    async function api(path, options = {}) {
      const res = await fetch("/api" + path, { headers: { "Content-Type": "application/json" }, ...options });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || res.statusText);
      return body;
    }

    function render(tasks) {
      list.innerHTML = "";
      for (const t of tasks) {
        const li = document.createElement("li");
        if (t.done) li.className = "done";
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = t.done;
        box.onchange = () => api("/tasks/" + t._id, { method: "PATCH", body: JSON.stringify({ done: box.checked }) }).then(load).catch(showError);
        const title = document.createElement("span");
        title.className = "title";
        title.textContent = t.title;
        const del = document.createElement("button");
        del.className = "del";
        del.title = "מחיקה";
        del.textContent = "✕";
        del.onclick = () => api("/tasks/" + t._id, { method: "DELETE" }).then(load).catch(showError);
        li.append(box, title, del);
        list.append(li);
      }
      const open = tasks.filter((t) => !t.done).length;
      status.className = "status";
      status.textContent = `${tasks.length} משימות, ${open} פתוחות`;
    }

    function showError(err) {
      status.className = "status error";
      status.textContent = "שגיאה: " + err.message;
    }

    function load() { return api("/tasks").then(render).catch(showError); }

    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("title");
      try {
        await api("/tasks", { method: "POST", body: JSON.stringify({ title: input.value }) });
        input.value = "";
        load();
      } catch (err) { showError(err); }
    };

    load();
  </script>
</body>
</html>
