server {
  listen 80;

  # Docker's internal DNS: look up "api" on each request,
  # so nginx starts even if the api container is not ready yet
  resolver 127.0.0.11 valid=10s;

  # the site
  location / {
    root /usr/share/nginx/html;
    index index.html;
  }

  # browser calls /api/... and nginx forwards to the api container
  location /api/ {
    set $api http://api:3000;
    proxy_pass $api;
  }
}
