services:
  # the site: http://localhost:8080
  client:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./client/index.html:/usr/share/nginx/html/index.html:ro
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # the API: http://localhost:3000 (from n8n: http://api:3000)
  api:
    build: ./api
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  # the database is Neon (in the cloud), so there is no mongo/postgres service here

  # n8n: http://localhost:5678
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Jerusalem
      - TZ=Asia/Jerusalem
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n-data:
