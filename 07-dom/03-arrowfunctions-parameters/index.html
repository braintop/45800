<html lang="en">

<body>
    


    <script>
        //1 - regular function
        function sayHello(name){
            console.log("Hello " + name);
        }

        sayHello("Oren");
        //2 - arrow function§
        let sayHellow2 =    (name)=>{
            console.log("Hello");
        }
        sayHellow2("Oren");


        //3 - function expression
        let sayHellow3 = function(name){
            console.log("Hello");
        }
        sayHellow3("Oren");
    </script>
</body>
</html>
