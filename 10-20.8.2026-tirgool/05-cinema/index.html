<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
    </nav>
    <main>
        <h1>Welcome to the cinema</h1>
        <form>
            <div>
                <label for="movie">Movie</label>
                <input type="text" value="The Dark Knight" id="movie" name="movie" required>
            </div>
            <div>
                <label for="genre">Genre</label>
                <select id="genre" required>
                    <option value="">בחר ז'אנר</option>
                    <option value="אקשן">אקשן</option>
                    <option value="קומדיה">קומדיה</option>
                    <option value="דרמה">דרמה</option>
                    <option value="אימה">אימה</option>
                    <option value="מדע בדיוני">מדע בדיוני</option>
                    <option value="אנימציה">אנימציה</option>
                  </select>
                        </div>
            <div>
                <label for="director">Director</label>
                <input type="text" value="Asaf Bar" id="director" name="director" required minlength="2">
            </div>
            <div>
                <label for="date">Date</label>
                <input type="date" value="2026-08-20" id="date" name="date" required>
            </div>
            <div>
                <label for="time">Time</label>
                <input type="time" value="10:00" id="time" name="time" required min="1" max="300">
            </div>
            <div>
                <label for="price">Price</label>
                    <input type="number" value="100" id="price" name="price" required min="1" max="200">
            </div>
            <!-- <div>
                <label for="image">Image</label>
                <input type="text" id="image" name="image" required>
            </div> -->
            <button onclick="addMovie(event)">הוסף סרט</button>
        </form>
        <div id="stats"></div>


        <table border="1">
            <thead>
                <tr>
                    <th>Movie</th>
                    <th>Time</th>
                    <th>Price</th>
                    <th>genre</th>
                    <th>director</th>
                    <th>date</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </main>

    <script src="app.js"></script>
</body>
</html>
