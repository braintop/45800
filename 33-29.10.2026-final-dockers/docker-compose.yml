services:
  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api # wait for the api service to start before starting the client

  api:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/productsdb
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: